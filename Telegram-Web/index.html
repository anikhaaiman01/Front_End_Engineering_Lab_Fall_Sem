<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Telegram Web</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="telegram">

```
<aside class="sidebar">

    <h1>Telegram</h1>

    <input type="text" placeholder="Search">

    <section class="chat-list">

        <article class="chat-item">
            <h3>John</h3>
            <p>I'm good. What about you?</p>
        </article>

        <article class="chat-item">
            <h3>Sarah</h3>
            <p>See you tomorrow.</p>
        </article>

        <article class="chat-item">
            <h3>College Group</h3>
            <p>Assignment submission tomorrow.</p>
        </article>

    </section>

</aside>

<section class="chat">

    <header class="chat-header">
        <h2>John</h2>
        <p>online</p>
    </header>

    <section class="messages">

        <article class="message received">
            <p>Hello!</p>
        </article>

        <article class="message sent">
            <p>Hey! How are you?</p>
        </article>

        <article class="message received">
            <p>I'm good. What about you?</p>
        </article>

    </section>

    <footer class="message-input">

        <input type="text" placeholder="Write a message...">

        <button>Send</button>

    </footer>

</section>
```

</main>

</body>
</html>
