<!DOCTYPE html>
<html>
<head>
    <title>Telegram Web</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="telegram">
<div class="sidebar">

    <h1>Telegram</h1>

    <input type="text" placeholder="Search">

    <div class="chat-list">

        <div class="chat-item">
            <h3>John</h3>
            <p>I'm good. What about you?</p>
        </div>

        <div class="chat-item">
            <h3>Sarah</h3>
            <p>See you tomorrow.</p>
        </div>

        <div class="chat-item">
            <h3>College Group</h3>
            <p>Assignment submission tomorrow.</p>
        </div>

    </div>

</div>
<div class="chat">

    <div class="chat-header">
        <h2>John</h2>
        <p>online</p>
    </div>

    <div class="messages">

        <div class="message received">
            <p>Hello!</p>
        </div>

        <div class="message sent">
            <p>Hey! How are you?</p>
        </div>

        <div class="message received">
            <p>I'm good. What about you?</p>
        </div>

    </div>

    <div class="message-input">

        <input type="text" placeholder="Write a message...">

        <button>Send</button>

    </div>

</div>

</div>
</body>
</html>
