<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Profile</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
        }

        /* Main Container */

        .component-container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Profile Header */

        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
        }

        /* Avatar */

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #bae6fd, #0284c7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            color: white;
            border: 4px solid #e0f2fe;
            transition: transform 0.25s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* Profile Details */

        .profile-details {
            width: 100%;
        }

        .username {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .profession {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .bio {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .portfolio {
            color: #0284c7;
            text-decoration: none;
            font-size: 14px;
        }

        /* Statistics */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #f8fafc;
            padding: 15px 5px;
            border-radius: 10px;
            margin: 20px 0;
            gap: 5px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-box h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .stat-box p {
            color: #64748b;
            font-size: 12px;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.25s ease,
                        background-color 0.25s ease;
        }

        .follow {
            background-color: #0284c7;
            color: white;
        }

        .message {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .buttons button:hover {
            opacity: 0.85;
        }

        .buttons button:active {
            transform: scale(0.96);
        }

        /* Story Highlights */

        .highlights {
            margin-top: 35px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .highlights h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .story-list {
            display: flex;
            overflow-x: auto;
            gap: 1rem;
            padding-bottom: 10px;
        }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-size: 12px;
            color: #475569;
        }

        .story-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #bae6fd, #0284c7);
            border: 3px solid #e0f2fe;
        }

        .more {
            justify-content: center;
        }

        /* Desktop Layout */

        @media (min-width: 768px) {

            .profile-header {
                flex-direction: row;
                align-items: flex-start;
                text-align: left;
                gap: 30px;
            }

            .avatar {
                flex-shrink: 0;
            }

            .profile-details {
                flex: 1;
            }

            .buttons {
                max-width: 300px;
            }

        }

    </style>
</head>

<body>

    <main class="component-container">

        <!-- Profile Header -->

        <section class="profile-header">

            <div class="avatar">
                AR
            </div>

            <div class="profile-details">

                <h2 class="username">alex_designer</h2>

                <p class="profession">
                    UI Engineer • portfolio-alex.dev
                </p>

                <div class="stats">

                    <div class="stat-box">
                        <h3>148</h3>
                        <p>Posts</p>
                    </div>

                    <div class="stat-box">
                        <h3>12.4k</h3>
                        <p>Followers</p>
                    </div>

                    <div class="stat-box">
                        <h3>420</h3>
                        <p>Following</p>
                    </div>

                </div>

                <p class="bio">
                    Alex Rivera • UI Engineer
                    <br>
                    Building web design systems and open source widgets.
                </p>

                <a href="#" class="portfolio">
                    portfolio-alex.dev
                </a>

                <div class="buttons">

                    <button class="follow">
                        Follow
                    </button>

                    <button class="message">
                        Message
                    </button>

                </div>

            </div>

        </section>

        <!-- Story Highlights -->

        <section class="highlights">

            <h3>Story Highlights</h3>

            <div class="story-list">

                <div class="story">
                    <div class="story-circle"></div>
                    <p>Design</p>
                </div>

                <div class="story">
                    <div class="story-circle"></div>
                    <p>Projects</p>
                </div>

                <div class="story">
                    <div class="story-circle"></div>
                    <p>Work</p>
                </div>

                <div class="story">
                    <div class="story-circle"></div>
                    <p>Tips</p>
                </div>

                <div class="story more">
                    <div class="story-circle"></div>
                    <p>+ More</p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
