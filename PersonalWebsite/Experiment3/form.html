<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect With Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

```
<header>
    <h1>Connect With Me</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="form.html">Contact Form</a>
    </nav>
</header>

<main>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Other"> Other

        </fieldset>

        <br>

        <fieldset>
            <legend>Contact Information</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <br><br>

            <label for="city">City:</label>
            <input type="text" id="city" name="city">

        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Details</legend>

            <label for="institution">Institution:</label>
            <input type="text" id="institution" name="institution">

            <br><br>

            <label for="designation">Designation:</label>
            <input type="text" id="designation" name="designation">

            <br><br>

            <label for="study">Area of Study:</label>
            <input type="text" id="study" name="study">

        </fieldset>

        <br>

        <fieldset>
            <legend>Interests and Skills</legend>

            <label>Areas of Interest:</label>

            <input type="checkbox" name="interest" value="Technology"> Technology
            <input type="checkbox" name="interest" value="Sports"> Sports
            <input type="checkbox" name="interest" value="Music"> Music
            <input type="checkbox" name="interest" value="Coding"> Coding

            <br><br>

            <label for="skills">Skills:</label>
            <textarea id="skills" name="skills"></textarea>

        </fieldset>

        <br>

        <fieldset>
            <legend>Purpose of Contact</legend>

            <label for="purpose">Select Purpose:</label>

            <select id="purpose" name="purpose">
                <option>Collaboration</option>
                <option>Project Discussion</option>
                <option>Networking</option>
                <option>General Enquiry</option>
            </select>

        </fieldset>

        <br>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="message">Message:</label>
            <br>

            <textarea id="message" name="message"
                      rows="5" cols="40"></textarea>

        </fieldset>

        <br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</main>

<footer>
    <p>My Personal Website | 2026</p>
</footer>
```

</body>
</html>
